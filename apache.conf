<VirtualHost *:80>
    DocumentRoot /app/public
    <Directory /app/public>
        Require all granted
        AllowOverride None
        Options -Indexes
        # Todas las rutas (/v1/<accion>, /salud) las atiende index.php
        FallbackResource /index.php
    </Directory>
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
